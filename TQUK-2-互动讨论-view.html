<script>
var cur=1,total=12;
var slides=document.querySelectorAll('.slide');
function show(n){
  slides.forEach(function(s){s.classList.remove('on');});
  var el=document.getElementById('s'+n);
  if(el)el.classList.add('on');
  document.getElementById('cur').textContent=n;
  document.getElementById('prev').disabled=(n<=1);
  document.getElementById('next').disabled=(n>=total);
  try{history.replaceState(null,'','#s'+n);}catch(e){}
}
function go(d){
  var n=cur+d;
  if(n<1||n>total)return;
  cur=n;show(n);
}
document.addEventListener('keydown',function(e){
  if(e.key=='ArrowLeft'||e.key=='ArrowUp')go(-1);
  if(e.key=='ArrowRight'||e.key=='ArrowDown'||e.key==' ')go(1);
  if(e.key=='Escape')location.href='home.html';
});
var sx,sy;
document.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-sx;
  var dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)){go(dx>0?-1:1);}
},{passive:true});
var h=location.hash.match(/s(\d+)/);
if(h){cur=parseInt(h[1]);if(cur<1)cur=1;if(cur>total)cur=total;show(cur);}
show(cur);
</script>
