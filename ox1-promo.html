<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OX1 Academy 朋友圈推广图 · UncleFrankie</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f7;
    color: #1d1d1f;
    padding: 24px 16px 48px;
    line-height: 1.6;
  }
  .container { max-width: 480px; margin: 0 auto; }
  .header {
    text-align: center;
    margin-bottom: 20px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: #1d1d1f;
    margin-bottom: 6px;
  }
  .header p {
    font-size: 13px;
    color: #6e6e73;
  }
  .card {
    background: #ffffff;
    border-radius: 18px;
    padding: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    margin-bottom: 20px;
  }
  .card img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 12px;
  }
  .tips {
    background: #fff8e6;
    border-left: 4px solid #d4af37;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    color: #5a4a1f;
    margin-bottom: 16px;
  }
  .tips strong { color: #8a6d1c; }
  .btn-row {
    display: grid;
    gap: 10px;
    margin-bottom: 24px;
  }
  .btn {
    display: block;
    text-align: center;
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #1a2540 0%, #2d3a5f 100%);
    color: #d4af37;
    border: 1px solid #d4af37;
  }
  .btn-secondary {
    background: #ffffff;
    color: #1a2540;
    border: 1px solid #d0d0d5;
  }
  .info {
    font-size: 12px;
    color: #6e6e73;
    background: #fafafa;
    padding: 12px 14px;
    border-radius: 10px;
  }
  .info code {
    background: #eef0f3;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    color: #1a2540;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>OX1 Academy · 朋友圈推广图</h1>
      <p>UncleFrankie 制作 · 4 大能力版</p>
    </div>

    <div class="card">
      <img src="./ox1_promo_card.png" alt="OX1 Academy 朋友圈推广图">
    </div>

    <div class="tips">
      <strong>使用提示:</strong> 长按图片可保存到相册,然后到微信朋友圈发布;或直接截图当前页面。
    </div>

    <div class="btn-row">
      <a href="./ox1_promo_card.png" download class="btn btn-primary">⬇ 长按保存图片到相册</a>
      <a href="./index.html" class="btn btn-secondary">← 返回 Frankie 工作台</a>
    </div>

    <div class="info">
      直接图片链接:<br>
      <code>https://unclefrankie422.github.io/boyboy-manager/ox1_promo_card.png</code>
    </div>
  </div>
</body>
</html>
